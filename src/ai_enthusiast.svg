<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" role="img" aria-label="AI Enthusiast animation">
  <style>
    .kat { font: 40px 'Noto Sans JP', sans-serif; fill:#9be7ff; opacity:1; }
    .scr { font: 38px 'Noto Sans JP', monospace; fill:#fff; opacity:0; letter-spacing:6px; }
    .eng { font: 36px 'Inter', sans-serif; fill:#ffd36b; opacity:0; }
  </style>

  <!-- Katakana -->
  <text x="30" y="50" class="kat">エーアイエンスージアスト
    <animate attributeName="opacity" values="1;1;0" dur="2.5s" begin="0s" fill="freeze"/>
  </text>

  <!-- Scramble frames (rapid flash) -->
  <g>
    <text x="30" y="50" class="scr" opacity="0">ｴｰﾒ!ﾂ@ｱ!ｲ</text>
    <text x="30" y="50" class="scr" opacity="0">ﾒｸ!ﾝﾄﾞ#ｳ</text>
    <text x="30" y="50" class="scr" opacity="0">ｸﾞ%ｭｳ&ﾌ</text>
    <text x="30" y="50" class="scr" opacity="0">ｾ*ﾓ(ﾄ)ｱ</text>

    <!-- rapid flashing timeline -->
    <animate xlink:href="#scr1" attributeName="opacity" from="0" to="1" dur="0.12s" begin="1s" fill="freeze"/>
  </g>

  <!-- Using explicit animate on each scramble text -->
  <text x="30" y="50" class="scr">
    <tspan opacity="0">ｴｰﾒ!ﾂ@ｱ!ｲ</tspan>
    <animate attributeName="opacity" values="0;1;0" dur="0.12s" begin="1.00s" fill="freeze"/>
  </text>
  <text x="30" y="50" class="scr">
    <tspan opacity="0">ﾒｸ!ﾝﾄﾞ#ｳ</tspan>
    <animate attributeName="opacity" values="0;1;0" dur="0.12s" begin="1.12s" fill="freeze"/>
  </text>
  <text x="30" y="50" class="scr">
    <tspan opacity="0">ｸﾞ%ｭｳ&ﾌ</tspan>
    <animate attributeName="opacity" values="0;1;0" dur="0.12s" begin="1.24s" fill="freeze"/>
  </text>
  <text x="30" y="50" class="scr">
    <tspan opacity="0">ｾ*ﾓ(ﾄ)ｱ</tspan>
    <animate attributeName="opacity" values="0;1;0" dur="0.12s" begin="1.36s" fill="freeze"/>
  </text>
  <text x="30" y="50" class="scr">
    <tspan opacity="0">ﾀﾞ#ｶ!ﾝ%ﾄ</tspan>
    <animate attributeName="opacity" values="0;1;0" dur="0.12s" begin="1.48s" fill="freeze"/>
  </text>

  <!-- English - typewriter-like per-letter fade-in -->
  <text x="30" y="95" class="eng">
    <tspan opacity="0">A</tspan>
    <tspan opacity="0">I</tspan>
    <tspan opacity="0"> </tspan>
    <tspan opacity="0">E</tspan>
    <tspan opacity="0">n</tspan>
    <tspan opacity="0">t</tspan>
    <tspan opacity="0">h</tspan>
    <tspan opacity="0">u</tspan>
    <tspan opacity="0">s</tspan>
    <tspan opacity="0">i</tspan>
    <tspan opacity="0">a</tspan>
    <tspan opacity="0">s</tspan>
    <tspan opacity="0">t</tspan>
    <!-- animate each letter in sequence -->
    <animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.01s" additive="sum" /><!-- A -->
    <animate attributeName="opacity" values="0;1" begin="2.78s" dur="0.01s" additive="sum" /><!-- I -->
    <animate attributeName="opacity" values="0;1" begin="2.86s" dur="0.01s" additive="sum" /><!-- space -->
    <animate attributeName="opacity" values="0;1" begin="2.94s" dur="0.01s" additive="sum" /><!-- E -->
    <animate attributeName="opacity" values="0;1" begin="3.02s" dur="0.01s" additive="sum" /><!-- n -->
    <animate attributeName="opacity" values="0;1" begin="3.10s" dur="0.01s" additive="sum" /><!-- t -->
    <animate attributeName="opacity" values="0;1" begin="3.18s" dur="0.01s" additive="sum" /><!-- h -->
    <animate attributeName="opacity" values="0;1" begin="3.26s" dur="0.01s" additive="sum" /><!-- u -->
    <animate attributeName="opacity" values="0;1" begin="3.34s" dur="0.01s" additive="sum" /><!-- s -->
    <animate attributeName="opacity" values="0;1" begin="3.42s" dur="0.01s" additive="sum" /><!-- i -->
    <animate attributeName="opacity" values="0;1" begin="3.50s" dur="0.01s" additive="sum" /><!-- a -->
    <animate attributeName="opacity" values="0;1" begin="3.58s" dur="0.01s" additive="sum" /><!-- s -->
    <animate attributeName="opacity" values="0;1" begin="3.66s" dur="0.01s" additive="sum" /><!-- t -->
  </text>
</svg>
