<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="Machine Learning Explorer animation">
  <style>
    .kat { font: 36px 'Noto Sans JP', sans-serif; fill:#b3ffea; opacity:1; }
    .scr { font: 34px monospace; fill:#fff; opacity:0; letter-spacing:5px; }
    .eng { font: 30px 'Inter', sans-serif; fill:#ffd36b; opacity:0; }
  </style>

  <text x="30" y="50" class="kat">マシンラーニングエクスプローラー
    <animate attributeName="opacity" values="1;1;0" dur="2.5s" begin="0s" fill="freeze"/>
  </text>

  <!-- scramble flashes -->
  <text x="30" y="50" class="scr"><tspan>ﾏ#ｼﾝ!ﾗ</tspan><animate attributeName="opacity" values="0;1;0" dur="0.12s" begin="1.00s" fill="freeze"/></text>
  <text x="30" y="50" class="scr"><tspan>ｸﾞ%ﾘｨ^ﾝ</tspan><animate attributeName="opacity" values="0;1;0" dur="0.12s" begin="1.12s" fill="freeze"/></text>
  <text x="30" y="50" class="scr"><tspan>ﾝ&ｴｸ*ｽ</tspan><animate attributeName="opacity" values="0;1;0" dur="0.12s" begin="1.24s" fill="freeze"/></text>
  <text x="30" y="50" class="scr"><tspan>ﾌﾟ(ﾛ)ｰ</tspan><animate attributeName="opacity" values="0;1;0" dur="0.12s" begin="1.36s" fill="freeze"/></text>
  <text x="30" y="50" class="scr"><tspan>ﾚ_ｰ!ｻﾞ</tspan><animate attributeName="opacity" values="0;1;0" dur="0.12s" begin="1.48s" fill="freeze"/></text>

  <!-- English typing -->
  <text x="30" y="95" class="eng">
    <tspan opacity="0">M</tspan><tspan opacity="0">a</tspan><tspan opacity="0">c</tspan><tspan opacity="0">h</tspan><tspan opacity="0">i</tspan><tspan opacity="0">n</tspan><tspan opacity="0">e</tspan>
    <tspan opacity="0"> </tspan>
    <tspan opacity="0">L</tspan><tspan opacity="0">e</tspan><tspan opacity="0">a</tspan><tspan opacity="0">r</tspan><tspan opacity="0">n</tspan><tspan opacity="0">i</tspan><tspan opacity="0">n</tspan><tspan opacity="0">g</tspan>
    <tspan opacity="0"> </tspan>
    <tspan opacity="0">E</tspan><tspan opacity="0">x</tspan><tspan opacity="0">p</tspan><tspan opacity="0">l</tspan><tspan opacity="0">o</tspan><tspan opacity="0">r</tspan><tspan opacity="0">e</tspan><tspan opacity="0">r</tspan>

    <!-- sequence -->
    <animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.01s" additive="sum" />
    <animate attributeName="opacity" values="0;1" begin="2.78s" dur="0.01s" additive="sum" />
    <animate attributeName="opacity" values="0;1" begin="2.86s" dur="0.01s" additive="sum" />
    <animate attributeName="opacity" values="0;1" begin="2.94s" dur="0.01s" additive="sum" />
    <animate attributeName="opacity" values="0;1" begin="3.02s" dur="0.01s" additive="sum" />
    <animate attributeName="opacity" values="0;1" begin="3.10s" dur="0.01s" additive="sum" />
    <animate attributeName="opacity" values="0;1" begin="3.18s" dur="0.01s" additive="sum" />
    <!-- continue for all letters with incremental begins if needed -->
  </text>
</svg>
