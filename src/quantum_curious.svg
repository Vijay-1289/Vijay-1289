<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="920" height="120" role="img" aria-label="Quantum Curious animation">
  <style>
    .kat { font: 38px 'Noto Sans JP', sans-serif; fill:#d6b3ff; opacity:1; }
    .scr { font: 36px monospace; fill:#fff; opacity:0; letter-spacing:6px; }
    .eng { font: 34px 'Inter', sans-serif; fill:#aaffd1; opacity:0; }
  </style>

  <text x="30" y="50" class="kat">クォンタムキュリアス
    <animate attributeName="opacity" values="1;1;0" dur="2.5s" begin="0s" fill="freeze"/>
  </text>

  <text x="30" y="50" class="scr"><tspan>ｸ@ｫ#ﾝ</tspan><animate attributeName="opacity" values="0;1;0" dur="0.12s" begin="1.00s" fill="freeze"/></text>
  <text x="30" y="50" class="scr"><tspan>ﾀ%ﾑ&ｷ</tspan><animate attributeName="opacity" values="0;1;0" dur="0.12s" begin="1.12s" fill="freeze"/></text>
  <text x="30" y="50" class="scr"><tspan>ｭ*ﾘ(ｱ)</tspan><animate attributeName="opacity" values="0;1;0" dur="0.12s" begin="1.24s" fill="freeze"/></text>
  <text x="30" y="50" class="scr"><tspan>ｽ_!#?%</tspan><animate attributeName="opacity" values="0;1;0" dur="0.12s" begin="1.36s" fill="freeze"/></text>

  <text x="30" y="95" class="eng">
    <tspan opacity="0">Q</tspan><tspan opacity="0">u</tspan><tspan opacity="0">a</tspan><tspan opacity="0">n</tspan><tspan opacity="0">t</tspan><tspan opacity="0">u</tspan><tspan opacity="0">m</tspan>
    <tspan opacity="0"> </tspan>
    <tspan opacity="0">C</tspan><tspan opacity="0">u</tspan><tspan opacity="0">r</tspan><tspan opacity="0">i</tspan><tspan opacity="0">o</tspan><tspan opacity="0">u</tspan><tspan opacity="0">s</tspan>

    <animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.01s" additive="sum" />
    <!-- continue sequence -->
  </text>
</svg>
