<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="80" viewBox="0 0 1000 80">
  <style>
    .jp { font: 36px 'Noto Sans JP', sans-serif; fill:#ff79c6; }
    .scr { font: 34px monospace; fill:#ffffff; }
    .en { font: 36px 'Fira Code', monospace; fill:#f1fa8c; }
  </style>

  <!-- AI Enthusiast -->
  <text x="50" y="50" class="jp" opacity="0">
    エーアイエンスージアスト
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.3s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="2s" dur="0.3s" fill="freeze"/>
  </text>

  <text x="50" y="50" class="scr" opacity="0">
    ##@!$@!!##
    <animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.15s"/>
    <animate attributeName="opacity" from="1" to="0" begin="3.5s" dur="0.15s"/>
  </text>

  <text x="50" y="50" class="en" opacity="0">
    AI Enthusiast
    <animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.3s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="4.5s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- Machine Learning Explorer -->
  <text x="50" y="50" class="jp" opacity="0">
    マシンラーニングエクスプローラー
    <animate attributeName="opacity" from="0" to="1" begin="5s" dur="0.3s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="7s" dur="0.3s" fill="freeze"/>
  </text>

  <text x="50" y="50" class="scr" opacity="0">
    @@##!!$$##
    <animate attributeName="opacity" from="0" to="1" begin="8s" dur="0.15s"/>
    <animate attributeName="opacity" from="1" to="0" begin="8.5s" dur="0.15s"/>
  </text>

  <text x="50" y="50" class="en" opacity="0">
    Machine Learning Explorer
    <animate attributeName="opacity" from="0" to="1" begin="9s" dur="0.3s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="10s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- Python Developer -->
  <text x="50" y="50" class="jp" opacity="0">
    パイソンデベロッパー
    <animate attributeName="opacity" from="0" to="1" begin="10.5s" dur="0.3s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="12.5s" dur="0.3s" fill="freeze"/>
  </text>

  <text x="50" y="50" class="scr" opacity="0">
    !!@@##$$!!
    <animate attributeName="opacity" from="0" to="1" begin="13s" dur="0.15s"/>
    <animate attributeName="opacity" from="1" to="0" begin="13.5s" dur="0.15s"/>
  </text>

  <text x="50" y="50" class="en" opacity="0">
    Python Developer
    <animate attributeName="opacity" from="0" to="1" begin="14s" dur="0.3s" fill="freeze"/>
  </text>

</svg>
