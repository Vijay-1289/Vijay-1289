<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="90" viewBox="0 0 1100 90">
  <style>
    .jp { font: 36px 'Noto Sans JP', sans-serif; fill:#ff79c6; }
    .scr { font: 34px monospace; fill:#ffffff; }
    .en { font: 36px 'Fira Code', monospace; fill:#f1fa8c; }
    .cursor { font: 36px 'Fira Code', monospace; fill:#f1fa8c; }
  </style>

  <!-- LOOP CONTROLLER -->
  <animate id="loop" attributeName="opacity" from="1" to="1" begin="0s" dur="22s" />

  <!-- CURSOR BLINK -->
  <text x="50%" y="55" class="cursor" opacity="0" text-anchor="middle">
    |
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </text>

  <!-- 1️⃣ AI Enthusiast -->
  <text x="50%" y="55" class="jp" text-anchor="middle" opacity="0">
    エーアイエンスージアスト
    <animate attributeName="opacity" from="0" to="1" begin="0s;loop.end" dur="0.3s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="2s" dur="0.3s"/>
  </text>

  <text x="50%" y="55" class="scr" text-anchor="middle" opacity="0">
    ##@!$@!!
    <animate attributeName="opacity" from="0" to="1" begin="2.1s;loop.end+2.1s" dur="0.15s"/>
    <animate attributeName="opacity" from="1" to="0" begin="2.3s" dur="0.15s"/>
  </text>

  <text x="50%" y="55" class="en" text-anchor="middle" opacity="0">
    AI Enthusiast
    <animate attributeName="opacity" from="0" to="1" begin="2.5s;loop.end+2.5s" dur="0.3s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="5s" dur="0.3s"/>
  </text>

  <!-- 2️⃣ Machine Learning Explorer -->
  <text x="50%" y="55" class="jp" text-anchor="middle" opacity="0">
    マシンラーニングエクスプローラー
    <animate attributeName="opacity" from="0" to="1" begin="5.2s;loop.end+5.2s" dur="0.3s"/>
    <animate attributeName="opacity" from="1" to="0" begin="7.2s" dur="0.3s"/>
  </text>

  <text x="50%" y="55" class="scr" text-anchor="middle" opacity="0">
    @@##!!$$
    <animate attributeName="opacity" from="0" to="1" begin="7.3s;loop.end+7.3s" dur="0.15s"/>
    <animate attributeName="opacity" from="1" to="0" begin="7.5s" dur="0.15s"/>
  </text>

  <text x="50%" y="55" class="en" text-anchor="middle" opacity="0">
    Machine Learning Explorer
    <animate attributeName="opacity" from="0" to="1" begin="7.7s;loop.end+7.7s" dur="0.3s"/>
    <animate attributeName="opacity" from="1" to="0" begin="11s" dur="0.3s"/>
  </text>

  <!-- 3️⃣ Python Developer -->
  <text x="50%" y="55" class="jp" text-anchor="middle" opacity="0">
    パイソンデベロッパー
    <animate attributeName="opacity" from="0" to="1" begin="11.2s;loop.end+11.2s" dur="0.3s"/>
    <animate attributeName="opacity" from="1" to="0" begin="13.2s" dur="0.3s"/>
  </text>

  <text x="50%" y="55" class="scr" text-anchor="middle" opacity="0">
    !!@@##$$
    <animate attributeName="opacity" from="0" to="1" begin="13.3s;loop.end+13.3s" dur="0.15s"/>
    <animate attributeName="opacity" from="1" to="0" begin="13.5s" dur="0.15s"/>
  </text>

  <text x="50%" y="55" class="en" text-anchor="middle" opacity="0">
    Python Developer
    <animate attributeName="opacity" from="0" to="1" begin="13.7s;loop.end+13.7s" dur="0.3s"/>
    <animate attributeName="opacity" from="1" to="0" begin="17s" dur="0.3s"/>
  </text>

</svg>
